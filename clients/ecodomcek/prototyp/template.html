<title>EcoDomček — prechádzka domom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f3eee3; --ink:#26221c; --ink2:#5b554a; --line:rgba(38,34,28,.2);
    --moss:#4d6a2f; --amber:#d2842a; --dusk:#12100e; --glow:#f2b563;
    --sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* the world: pre-rendered frames cross-dissolved by scroll */
  #world{position:fixed;inset:0;z-index:0;background:var(--paper);overflow:hidden}
  .frame{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
  .frame:first-child{opacity:1}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background .8s ease}
  body[data-t="light"] #veil{background:
    linear-gradient(90deg,rgba(243,238,227,.97) 0%,rgba(243,238,227,.9) 26%,rgba(243,238,227,.35) 48%,rgba(243,238,227,0) 66%)}
  body[data-t="dusk"] #veil{background:
    linear-gradient(90deg,rgba(18,16,14,.95) 0%,rgba(18,16,14,.88) 26%,rgba(18,16,14,.4) 50%,rgba(18,16,14,0) 70%)}
  body[data-t="dusk"]{background:var(--dusk);color:#f3eee3}
  body[data-t="dusk"] #world{background:var(--dusk)}

  #scroller{position:relative;z-index:2}
  .beat{min-height:100svh;display:flex;align-items:center;padding:0 clamp(20px,5vw,88px)}
  .panel{width:100%;max-width:min(600px,92vw);display:flex;flex-direction:column;gap:22px;opacity:0}
  .tag{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;
    letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
  body[data-t="dusk"] .tag{color:rgba(243,238,227,.72)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
  .rule{width:28px;height:1px;background:currentColor;flex:none;opacity:.55}
  h1,h2{margin:0;font-weight:300;letter-spacing:-.025em}
  h1{font-size:clamp(40px,6.6vw,92px);line-height:.98}
  h2{font-size:clamp(31px,4.6vw,60px);line-height:1.01}
  .eko{color:var(--moss)}
  body[data-t="dusk"] .eko{color:#a8c977}
  p{margin:0;font-size:clamp(16px,1.35vw,20px);line-height:1.55;max-width:min(46ch,100%)}
  body[data-t="dusk"] p{color:rgba(243,238,227,.88)}
  .fine{font-family:var(--mono);font-size:11px;line-height:1.6;letter-spacing:.04em;color:var(--ink2)}
  body[data-t="dusk"] .fine{color:rgba(243,238,227,.6)}
  .row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .cta{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 28px;border-radius:999px;
    background:var(--amber);color:#26221c;font-size:16px;font-weight:500;text-decoration:none;width:fit-content}
  .link{font-family:var(--mono);font-size:13px;letter-spacing:.05em;white-space:nowrap;
    border-bottom:1px solid currentColor;padding-bottom:3px;text-decoration:none;opacity:.85}
  .layers,.proj{border-top:1px solid var(--line)}
  body[data-t="dusk"] .layers,body[data-t="dusk"] .proj{border-color:rgba(243,238,227,.22)}
  .layers div,.proj div{display:flex;gap:14px;align-items:baseline;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:16px}
  body[data-t="dusk"] .layers div,body[data-t="dusk"] .proj div{border-color:rgba(243,238,227,.22)}
  .layers b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink2);width:22px;flex:none}
  .proj b{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink2);width:40px;flex:none}
  .layers span,.proj span{flex:1}
  .layers i{font-family:var(--mono);font-size:11px;font-style:normal;color:var(--ink2)}
  .phone{font-size:clamp(36px,4.8vw,60px);font-weight:300;color:var(--glow);line-height:1;text-decoration:none}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:min(540px,100%);width:100%}
  .fields label{display:flex;flex-direction:column;gap:7px;font-family:var(--mono);font-size:10px;
    letter-spacing:.15em;text-transform:uppercase;color:rgba(243,238,227,.62)}
  .fields span{height:34px;border-bottom:1px solid rgba(243,238,227,.32)}
  .fields label.wide{grid-column:1/-1}

  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
    justify-content:space-between;gap:16px;padding:20px clamp(20px,5vw,88px);pointer-events:none}
  header::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(243,238,227,.92) 0%,rgba(243,238,227,.55) 55%,rgba(243,238,227,0) 100%)}
  body[data-t="dusk"] header::before{
    background:linear-gradient(180deg,rgba(18,16,14,.9) 0%,rgba(18,16,14,.5) 55%,rgba(18,16,14,0) 100%)}
  header *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:12px}
  .brand b{font-size:14px;font-weight:500;letter-spacing:.22em}
  .brand i{display:block;font-family:var(--mono);font-size:9px;font-style:normal;
    letter-spacing:.12em;color:var(--ink2);margin-top:3px}
  body[data-t="dusk"] .brand i{color:rgba(243,238,227,.6)}
  nav{display:flex;gap:30px;font-size:15px;font-weight:500}
  nav a{text-decoration:none;opacity:.92}
  .tel{font-family:var(--mono);font-size:13px;letter-spacing:.05em;text-decoration:none;
    display:flex;align-items:center;gap:9px}

  #foot{position:fixed;left:0;right:0;bottom:0;height:132px;z-index:4;pointer-events:none;
    background:linear-gradient(0deg,rgba(243,238,227,.85) 0%,rgba(243,238,227,0) 100%)}
  body[data-t="dusk"] #foot{background:linear-gradient(0deg,rgba(18,16,14,.85) 0%,rgba(18,16,14,0) 100%)}
  #map{position:fixed;right:clamp(20px,5vw,88px);bottom:36px;z-index:5;display:flex;align-items:center;
    gap:14px;font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
  body[data-t="dusk"] #map{color:rgba(243,238,227,.72)}
  #map .dots{display:flex;gap:8px}
  #map .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.38;transition:.3s}
  #map .dots i.on{background:var(--amber);opacity:1;transform:scale(1.6)}
  #hint{position:fixed;left:clamp(20px,5vw,88px);bottom:36px;z-index:5;display:flex;align-items:center;
    gap:11px;font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink2);transition:opacity .5s}
  #note{position:fixed;left:44%;transform:translateX(-50%);bottom:36px;z-index:5;font-family:var(--mono);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);opacity:.7;text-align:center}
  body[data-t="dusk"] #note{color:rgba(243,238,227,.55)}

  @media (max-width:1560px){ #note{display:none} }
  @media (max-width:880px){
    nav{display:none}
    .brand i{display:none}
    .brand b{font-size:12px;letter-spacing:.18em}
    header{padding:14px 20px}
    .tel{font-size:12px}
    body[data-t="light"] #veil{background:linear-gradient(180deg,rgba(243,238,227,.62) 0%,rgba(243,238,227,.1) 22%,rgba(243,238,227,.9) 52%,var(--paper) 74%)}
    body[data-t="dusk"] #veil{background:linear-gradient(180deg,rgba(18,16,14,.6) 0%,rgba(18,16,14,.15) 22%,rgba(18,16,14,.92) 52%,var(--dusk) 74%)}
    .beat{align-items:flex-end;padding-bottom:120px}
    .fields{grid-template-columns:1fr}
    #hint,#note{display:none}
    #map{left:20px;right:20px;bottom:24px;justify-content:space-between}
  }
  @media (prefers-reduced-motion:reduce){ .frame{transition:none!important} }
</style>

<div id="world"><!--FRAMES--></div>
<div id="veil"></div>

<header>
  <div class="brand">
    <svg width="36" height="27" viewBox="0 0 40 30" fill="none" aria-hidden="true">
      <polyline points="2,28 20,8" stroke="#7a5a3a" stroke-width="5"/>
      <polyline points="20,8 38,28" stroke="#4d6a2f" stroke-width="5"/>
      <polyline points="11,28 20,18 29,28" stroke="#c9a96e" stroke-width="4"/>
    </svg>
    <div><b>ECODOMČEK</b><i>EKO·LOGICKÉ · EKO·NOMICKÉ STAVBY</i></div>
  </div>
  <nav><a href="#b7">Realizácie</a><a href="#b2">O nás</a><a href="#b4">Technológia</a><a href="#b8">Kontakt</a></nav>
  <a class="tel" href="tel:+421908704281"><span class="dot"></span>0908 704 281</a>
</header>

<div id="scroller">
  <!--SECTIONS-->
</div>

<div id="foot"></div>
<div id="hint">
  <svg width="14" height="24" viewBox="0 0 16 28" fill="none" aria-hidden="true"><path d="M8 2v22M2 18l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  Scrollujte — vchádzame dnu
</div>
<div id="note">Vizualizácia · finálne rendery z výkresov realizácie</div>
<div id="map"><span id="mapLabel">01 Exteriér</span><span class="dots" id="dots"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function(){
  var NAMES = /*NAMES*/;
  var THEMES = /*THEMES*/;
  var frames = [].slice.call(document.querySelectorAll('.frame'));
  var n = frames.length - 1;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var dotsWrap = document.getElementById('dots'), dotEls = [];
  NAMES.forEach(function(){ var e = document.createElement('i'); dotsWrap.appendChild(e); dotEls.push(e); });
  var mapLabel = document.getElementById('mapLabel');
  var hint = document.getElementById('hint');
  var lastIdx = -1;

  // scroll → which frame is showing, how far into it
  function apply(p){
    var f = Math.max(0, Math.min(n, p * n));
    var i = Math.min(n - 1, Math.floor(f));
    var t = f - i;
    for(var k = 0; k < frames.length; k++){
      var o = 0, s = 1;
      if(k === i) o = 1 - t;
      else if(k === i + 1) o = t;
      if(o > 0.001 && !reduce){
        // slow push: the still breathes instead of sitting dead
        var local = (k === i) ? t : t - 1;          // -1 → 0 → 1 across a beat
        s = 1.045 + local * 0.055;
      }
      frames[k].style.opacity = o;
      frames[k].style.transform = 'scale(' + s.toFixed(4) + ')';
    }
    var idx = Math.round(f);
    if(idx !== lastIdx){
      lastIdx = idx;
      mapLabel.textContent = NAMES[idx];
      for(var d = 0; d < dotEls.length; d++) dotEls[d].classList.toggle('on', d === idx);
      document.body.dataset.t = THEMES[idx];
    }
    hint.style.opacity = p > 0.015 ? 0 : 1;
  }

  document.body.dataset.t = THEMES[0];
  gsap.registerPlugin(ScrollTrigger);

  // native scroll owns the film — no smooth-scroll layer
  ScrollTrigger.create({
    trigger: '#scroller', start: 'top top', end: 'bottom bottom',
    onUpdate: function(self){ apply(self.progress); }
  });

  // text: ENTER → readable HOLD → EXIT
  gsap.utils.toArray('.panel').forEach(function(el){
    gsap.timeline({scrollTrigger:{trigger: el.parentElement, start:'top 80%', end:'bottom 20%', scrub: reduce ? false : 0.45}})
      .fromTo(el, {opacity:0, y: reduce ? 0 : 20}, {opacity:1, y:0, duration:.26, ease:'power2.out'})
      .to(el, {opacity:1, duration:.48})
      .to(el, {opacity: reduce ? 1 : 0, y: reduce ? 0 : -16, duration:.26, ease:'power2.in'});
  });

  apply(0);

  // review hook: ?beat=N holds one frame (static-frame test)
  var mb = location.search.match(/[?&]beat=([0-9.]+)/);
  if(mb){
    var bi = parseFloat(mb[1]), r = Math.round(bi);
    ScrollTrigger.getAll().forEach(function(s){ s.kill(); });
    apply(bi / n);
    gsap.set('.panel', {opacity:0, y:0});
    document.querySelectorAll('.beat').forEach(function(s, ix){
      if(ix === r){ s.style.position='fixed'; s.style.inset='0'; gsap.set(s.querySelector('.panel'), {opacity:1, y:0}); }
      else s.style.display='none';
    });
  }
})();
</script>
