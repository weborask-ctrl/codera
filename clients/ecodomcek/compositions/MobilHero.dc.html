  <div style="position: absolute; left: 20px; top: 420px; width: 350px; display: flex; flex-direction: column; gap: 16px;">

      <span class="mono" style="font-size: 10px; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; color: #5b554a;">01 / 09 · Exteriér · Lúčina · ráno</span>

    <h1 style="margin: 0; font-size: 40px; line-height: 1.02; font-weight: 300; letter-spacing: -0.02em; text-wrap: pretty;">Čo je <span style="color: #4d6a2f;">eko</span>logické, je aj <span style="color: #4d6a2f;">eko</span>nomické.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5;">Drevodomy na kľúč z Lúčiny pri Prešove. Prvý sme si postavili sami v roku 2007. Tento — v našej dedine — v roku 2024.</p>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 4px;">

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: center; justify-content: space-between;">
