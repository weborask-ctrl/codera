<!doctype html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codera — chobotnica v živom mori</title>
<style>
@font-face{font-family:Geist;src:url('/fonts/geist.woff2')}*{box-sizing:border-box}body{margin:0;background:#08638c;color:#fff;font-family:Geist,Arial,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;bottom:22px;left:24px;right:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#062e438c;border:1px solid #ffffff30;border-radius:16px;backdrop-filter:blur(18px)}button,select{font:inherit;color:#fff;background:#124c62;border:1px solid #ffffff40;border-radius:8px;padding:9px 12px;cursor:pointer}label{display:flex;gap:8px;align-items:center}output{margin-left:auto;font-size:13px}p{position:fixed;top:24px;left:28px;margin:0;font-size:16px;text-shadow:0 2px 12px #023749}input{width:110px}#error{top:70px;max-width:550px} @media(max-width:650px){aside{left:12px;right:12px;bottom:12px;gap:8px}output{width:100%;margin:0}label{font-size:13px}}
#controls{position:fixed;top:20px;right:22px;background:#06364d80;font-size:13px}body.clean #panel{display:none}#error{pointer-events:none}aside{bottom:max(16px,env(safe-area-inset-bottom));max-height:40dvh;overflow:auto}
</style>
<body data-octopus class="clean">
<canvas aria-label="Pohybujúca sa podmorská hladina, svetlo a priestorové častice"></canvas>
<button id="controls" aria-expanded="false" aria-controls="panel">Zobrazi&#357; ovl&#225;danie</button><p id="error" role="status"></p>
<aside id="panel" aria-label="Ovládanie štúdie"><button data-view="whole" aria-pressed="true">Celok</button><button data-view="detail" aria-pressed="false">Detail materiálu</button><button data-view="arms" aria-pressed="false">Detail ramien</button><button id="pause">Zastaviť</button><label>Kvalita <select id="quality"><option value="850000">Úsporná</option><option value="2073600" selected>Full HD</option><option value="8294400">Natívna / max. 4K</option></select></label><label>Hĺbka <input id="depth" type="range" min="2" max="16" step="0.1" value="3"></label><button id="travel">Prelet kamery</button><output id="stats">Načítavam more…</output></aside>
<script type="module" src="/octopus-look.mjs"></script>
</body></html>
